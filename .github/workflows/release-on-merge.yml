name: Publish Music Cue Pad release

'on':
  push:
    branches:
      - main
    paths:
      - app.config.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-cue-pad-release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout merged main with tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Decide whether the version needs publishing
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Get-Content -Raw -Encoding UTF8 'app.config.json' | ConvertFrom-Json
          $version = [string]$app.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          $tag = "v$version"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $tagMatches = @(git tag --list $tag)
          if ($tagMatches.Count -gt 0) {
            gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Tag $tag exists without a GitHub Release. Investigate manually." }
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Release $tag already exists; skipping."
            exit 0
          }
          "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate PowerShell syntax and encoding
        if: steps.version.outputs.publish == 'true'
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Build and test standalone artifacts
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Package standalone HTML, ZIP, hashes and release notes
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/prepare-release.ps1

      - name: Create tag and GitHub Release after successful validation
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "htmlapps-music-cue-pad-$env:RELEASE_TAG"
          $assets = @(
            ".release/$name.html"
            ".release/$name.self-extract.html"
            ".release/$name.zip"
            ".release/SHA256SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          }
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title "Music Cue Pad $env:RELEASE_TAG" --notes-file .release/release-notes.md --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed." }
